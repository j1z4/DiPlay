<!doctype html>
<meta charset="utf-8">
<body>
<pre id="log"></pre>
<iframe id="f" style="width:1440px;height:1000px"></iframe>
<script>
const out = [];
const log = (ok, msg) => { out.push(`${ok ? "PASS" : "FAIL"} ${msg}`); document.getElementById("log").textContent = out.join("\n"); };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
document.getElementById("f").addEventListener("load", async () => {
  try {
    await wait(800);
    const w = document.getElementById("f").contentWindow;
    const d = w.document;
    // Screen swaps run inside View Transitions, which apply the DOM change a frame later.
    // Count running transitions so each step waits for its screen, like a driver would.
    let transitions = 0;
    if (d.startViewTransition) {
      const start = d.startViewTransition.bind(d);
      d.startViewTransition = (cb) => { const t = start(cb); transitions++; t.finished.finally(() => transitions--); return t; };
    }
    const settle = async () => { for (let i = 0; i < 300 && transitions > 0; i++) await wait(10); };
    const key = async (k, n = 1) => { for (let i = 0; i < n; i++) { d.body.dispatchEvent(new w.KeyboardEvent("keydown", { key: k, bubbles: true, cancelable: true })); await wait(60); await settle(); } await wait(120); await settle(); };
    const fid = () => w.DP.focus.current?.dataset.fid || w.DP.focus.current?.textContent.trim();
    const screen = () => d.querySelector("#proto > .scr").className;

    log(fid() === "cat:overview", `starts on rail Overview (${fid()})`);
    await key("ArrowDown");
    log(fid() === "cat:connection" && d.querySelector(".scr-pane").textContent.includes("Automatic connection"), `focus down swaps pane to Connection (${fid()})`);
    await key("ArrowRight");
    log(fid() === "toggle:connectOnOpen", `right enters pane at first row (${fid()})`);
    const before = w.DP.focus.current.getAttribute("aria-checked");
    await key("Enter");
    log(w.DP.focus.current.getAttribute("aria-checked") !== before, `enter toggles switch (${before} -> ${w.DP.focus.current.getAttribute("aria-checked")})`);
    await key("ArrowDown", 2);
    log(fid() === "pick:connectionMode", `down twice reaches picker row (${fid()})`);
    await key("Enter");
    log(screen().includes("scr-picker"), `enter pushes picker (${screen()})`);
    await key("ArrowDown");
    await key("Enter");
    await wait(200);
    log(screen().includes("scr-settings") && fid() === "pick:connectionMode", `choose pops back with focus restored (${fid()})`);
    log(d.querySelector('.scr-pane [data-value-of="connectionMode"]').textContent === "USB", "value updated to USB");
    await key("ArrowLeft");
    log(fid() === "cat:connection", `left returns to current category (${fid()})`);
    await key("Escape");
    log(screen().includes("scr-home"), `escape goes back to home (${screen()})`);
    log(d.querySelector('#proto [data-value-of="connectionMode"]').textContent === "USB", "home card shows USB");

    w.location.hash = "walkthrough/connecting";
    await wait(6500);
    log(screen().includes("scr-home") && d.querySelector("#proto .dp-card__status").textContent.includes("connected") && d.querySelector("#proto .dp-card__item--status").dataset.tone === "connected", `connect flow ends on home, connected (${d.querySelector("#proto .dp-card__status").textContent.trim()}, tone ${d.querySelector("#proto .dp-card__item--status").dataset.tone})`);
    log(!!d.querySelector("#proto .dp-toast"), "toast shown after connecting");

    w.location.hash = "walkthrough/failed";
    await wait(300);
    await settle();
    await key("ArrowRight");
    await key("Enter");
    await wait(500);
    log(!!d.querySelector("#proto .dp-dialog") && w.DP.focus.current?.textContent.trim() === "Reset and connect", `reset opens dialog, confirm focused (${w.DP.focus.current?.textContent.trim()})`);
    await key("Escape");
    await wait(400);
    log(!d.querySelector("#proto .dp-dialog") && fid()?.includes("Reset CarPlay Wi-Fi"), `escape closes dialog and restores focus (${fid()})`);

    w.location.hash = "walkthrough/setup";
    await wait(300);
    await settle();
    await key("ArrowDown", 2);
    await key("Enter");
    log(d.querySelector('#proto [aria-checked="true"]')?.textContent.trim() === "DiLink 5", "setup choice selects DiLink 5");
    // Splash -> Home morph: no jump at the hand-off, and everything lands where Home puts it.
    w.location.hash = "walkthrough/splash";
    await wait(2900);
    const pick = (root) => ["mark", "name", "fork", "tagline"].map((n) => {
      const el = root.querySelector(n === "mark" ? ".dp-splash__fill, .dp-wordmark__mark" : `.dp-wordmark__${n}`);
      const r = el.getBoundingClientRect();
      return { n, x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width };
    });
    const splashAt = pick(d.querySelector("#proto .scr-splash"));
    for (let i = 0; i < 200 && !d.querySelector("#proto .scr-home"); i++) await wait(10);
    const tl = w.DP_APP.morph;
    const anims = tl ? [] : d.getAnimations();
    if (tl) tl.pause().progress(0);
    anims.forEach((a) => a.pause());
    anims.forEach((a) => (a.currentTime = 0));
    const atStart = pick(d.querySelector("#proto .scr-home"));
    const off = splashAt.map((b, i) => Math.max(Math.abs(b.x - atStart[i].x), Math.abs(b.y - atStart[i].y), Math.abs(b.w - atStart[i].w)));
    log([...d.querySelectorAll("#proto .scr-splash")].every((s) => s.classList.contains("is-retiring")) && off.every((o) => o < 1.5), `morph starts exactly on the splash layout (max offset ${off.map((o) => o.toFixed(2)).join(" / ")} px)`);
    if (tl) tl.progress(1);
    anims.filter((a) => a.effect?.getComputedTiming().endTime !== Infinity).forEach((a) => a.finish());
    const landed = pick(d.querySelector("#proto .scr-home"));
    const moved = landed.map((l, i) => Math.hypot(l.x - splashAt[i].x, l.y - splashAt[i].y));
    log(moved.every((m) => m > 20) && d.querySelector("#proto .dp-wordmark__mark").getAnimations().length === 0, `shared elements land on Home's layout (moved ${moved.map((m) => m.toFixed(0)).join(" / ")} px)`);

    // Connect from Home: the splash becomes the loading screen, with the status bottom-left.
    await wait(500);
    d.querySelector('#proto [data-fid="home:connect"]').click();
    await wait(500);
    const loading = d.querySelector("#proto .scr-connecting");
    const line = loading?.querySelector(".dp-statusline");
    const frame = d.getElementById("proto").getBoundingClientRect();
    const corner = line?.getBoundingClientRect();
    const bottomLeft = !!corner && corner.left - frame.left < frame.width * 0.1 && frame.bottom - corner.bottom < frame.height * 0.12;
    log(!!loading?.querySelector(".dp-splash.is-loading") && !loading.querySelector(".dp-wordmark") && line?.dataset.tone === "connecting" && bottomLeft, `Connect turns the splash into the icon-only loading screen, status bottom-left (${line?.dataset.tone}: ${line?.textContent.trim()})`);
    await key("Escape");
    await wait(1200);
    log(screen().includes("scr-home") && !d.querySelector("#proto .scr-connecting"), `Esc on the loading screen glides back to Home (${screen()})`);

    w.location.hash = "controls";
    await wait(300);
    await settle();
    const thumb = d.querySelector(".dp-segmented__thumb");
    const cur = thumb.parentElement.querySelector('[aria-checked="true"]');
    log(Math.abs(thumb.offsetWidth - cur.offsetWidth) < 2, `segmented thumb matches option width (${thumb.offsetWidth}/${cur.offsetWidth})`);
    log(w.DP.focus.scopes.length === 0, "focus engine released off the walkthrough page");
  } catch (e) {
    out.push("ERROR " + e.stack);
  }
  document.getElementById("log").textContent = out.join("\n") + "\nDONE";
});
window.addEventListener("error", (e) => out.push("ERROR " + e.message));
// selftest.html?libs=off runs the same checks against the no-library fallbacks.
document.getElementById("f").src = "index.html" + location.search + "#walkthrough/settings";
</script>
